name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [default, py311]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
          cache: true

      # FastDownward takes ~10 minutes to compile, so the build is cached per submodule commit and toolchain
      - name: Get the FastDownward commit
        id: downward
        run: echo "commit=$(git rev-parse HEAD:downward)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: downward-cache
        with:
          path: downward/builds
          key: downward-${{ runner.os }}-${{ steps.downward.outputs.commit }}-${{ hashFiles('pixi.lock') }}
      - name: Build FastDownward
        if: steps.downward-cache.outputs.cache-hit != 'true'
        run: pixi run -e ${{ matrix.environment }} build-fd

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test
