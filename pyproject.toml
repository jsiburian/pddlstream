[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pddlstream"
version = "2.0.0a1"
description = "PDDLStream: integrating symbolic planners and blackbox samplers via optimistic adaptive planning"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Caelan Reed Garrett" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
agent = ["mcp"] # pddlstream.tools.mcp_server

[project.urls]
Homepage = "https://github.com/caelan/pddlstream"

[tool.setuptools.packages.find]
# Only the library is packaged; examples/ and the FastDownward submodule stay in the checkout.
# FastDownward is found relative to the source tree, so install in editable mode (pixi does this) or set
# PDDLSTREAM_FD_PATH to a compiled FastDownward checkout.
include = ["pddlstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] # The examples package is not installed
markers = [
    "slow: takes several minutes (run with -m slow)",
    "gui: opens a viewer, so it runs under xvfb-run (run with pixi run test-gui)",
    "gurobi: needs gurobipy (run with pixi run -e full test-gurobi)",
    "benchmarks: runs stand-in benchmark episodes, about two minutes (run with pixi run test-benchmarks)",
]
addopts = "-m 'not slow and not gui and not gurobi and not benchmarks'"

[tool.ruff]
target-version = "py311"
line-length = 120
# Submodules with their own style
extend-exclude = ["downward", "examples/pybullet/utils", "benchmarks/robolab/RoboLab"]
# Where first-party modules live (the tests import their helpers as top-level modules)
src = [".", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ERA"]
ignore = [
    "E731", # Short named lambdas are used for callbacks and key functions
    "E741", # `l` is the conventional name for a literal
    "B006", # Mutable defaults are never mutated (checked); converting all of them would be churn
    "B008", # Defaults such as PlanConstraints() are immutable in practice
    "B905", # zip() without strict=; lengths are checked where they matter (safe_zip)
]

[tool.ruff.lint.isort]
# CI's lint job doesn't check out the submodules, and ruff only finds examples.pybullet.utils when they are there
known-first-party = ["benchmarks", "examples", "pddlstream"]

[tool.mypy]
python_version = "3.11"
# The layers that hold the data model and the public API; bodies of unannotated functions are not checked
files = ["pddlstream/core", "pddlstream/fastdownward", "pddlstream/language"]
ignore_missing_imports = true # The FastDownward translator and numpy are untyped here
warn_unused_ignores = true

##################################################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.60"

[tool.pixi.dependencies]
numpy = ">=2.3,<3"
psutil = "*" # Only needed when a solver is given max_memory

[tool.pixi.pypi-dependencies]
pddlstream = { path = ".", editable = true }

# Toolchain for compiling the FastDownward submodule
[tool.pixi.feature.build.dependencies]
cmake = ">=3.31"
make = "*"
c-compiler = "*"
cxx-compiler = "*"

# Pure-Python and Tkinter examples
[tool.pixi.feature.examples.dependencies]
scipy = "*"
tk = "*"

# PyBullet examples (scipy is imported by the nested motion-planners submodule)
[tool.pixi.feature.pybullet.dependencies]
pybullet = ">=3.25"
scipy = "*"
setuptools = "*" # Provides distutils for the optional IKFast build

# visualize=True (pygraphviz) and viewer screenshots
[tool.pixi.feature.viz.dependencies]
pygraphviz = "*"
matplotlib-base = "*"
pillow = "*"
pyscreenshot = "*"

# Optimizer examples (requires a Gurobi license for non-trivial models)
[tool.pixi.feature.gurobi.pypi-dependencies]
gurobipy = ">=13"

[tool.pixi.feature.gurobi.tasks]
test-gurobi = { cmd = "pytest -m gurobi", description = "Run the optimizer examples" }

[tool.pixi.feature.test.dependencies]
pytest = "*"

# Pinned to a minor version: ruff's formatting and rule set change between minor releases
[tool.pixi.feature.lint.dependencies]
ruff = "0.17.*"
mypy = "2.*"

[tool.pixi.feature.lint.tasks]
lint = { cmd = "ruff check && ruff format --check && mypy", description = "Check lint rules, formatting and types" }
format = { cmd = "ruff check --fix && ruff format", description = "Fix lint findings and format the code" }

# Python versions: 3.14 by default; 3.11 to match Isaac Sim (RoboLab)
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.environments]
default = { features = ["py314", "build", "examples", "pybullet", "test", "lint"], solve-group = "default" }
full = { features = ["py314", "build", "examples", "pybullet", "test", "viz", "gurobi"], solve-group = "default" }
py311 = { features = ["py311", "build", "examples", "pybullet", "test"], solve-group = "py311" }
# Just ruff, for the CI lint job
lint = { features = ["lint"], no-default-feature = true }

[tool.pixi.tasks]
submodules = { cmd = "git submodule update --init --recursive", description = "Fetch the FastDownward and pybullet-planning submodules" }
# The FastDownward fork declares cmake_minimum_required(2.8.3), which CMake 4 rejects without this policy floor.
# GCC 15 errors on an uninstantiated template in the bundled tl::optional (ext/optional.hh); -Wno-template-body
# downgrades that check. CMake reads CXXFLAGS only on first configure, so run clean-fd after changing it.
build-fd = { cmd = "python build.py", cwd = "downward", env = { CMAKE_POLICY_VERSION_MINIMUM = "3.5", CXXFLAGS = "-Wno-template-body" }, description = "Compile FastDownward (uses every core; pass -jN to limit memory use)" }
clean-fd = { cmd = "rm -rf downward/builds", description = "Delete the FastDownward build (needed after switching compilers)" }
setup = { depends-on = ["submodules", "build-fd"], description = "Fetch submodules and compile FastDownward" }
build-ikfast = { cmd = "python setup.py", cwd = "examples/pybullet/utils/pybullet_tools/ikfast/pr2", description = "Optional: compile the PR2 IKFast solver (otherwise pybullet IK is used)" }
test = { cmd = "pytest", description = "Run the fast test suite" }
test-gui = { cmd = "pytest -m 'gui and not slow and not gurobi'", description = "Run the examples that open viewers, under xvfb-run" }
test-benchmarks = { cmd = "pytest -m benchmarks", description = "Run the stand-in episodes of the robot benchmark integrations (benchmarks/)" }
timing = { cmd = "python tests/timing.py", description = "Time the timed example cases against the saved baseline (--save to update it)" }
